<div class="login-container">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-title class="card-title">Login SGHSS</mat-card-title>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" placeholder="seu.email@vidaplus.com" required autocomplete="email" />
          <mat-icon matSuffix>email</mat-icon>
          <mat-error *ngIf="loginForm.controls['email'].invalid && loginForm.controls['email'].touched">
            Email é obrigatório e deve ser válido.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Senha</mat-label>
          <input
            matInput
            [type]="hide ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          />
          <button
            mat-icon-button
            matSuffix
            (click)="hide = !hide"
            type="button"
            [attr.aria-label]="'Alternar visibilidade da senha'"
            [attr.aria-pressed]="hide"
          >
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched">
            Senha é obrigatória.
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="loginForm.invalid"
          class="material-button primary-button"
        >
          Entrar
        </button>
      </form>

      <a routerLink="/forgot-password" class="forgot-password-link">Esqueceu a senha?</a>
    </mat-card-content>
  </mat-card>
</div>
