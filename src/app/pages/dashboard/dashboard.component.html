<header class="dashboard-header">
  <h1>Dashboard SGHSS</h1>
  <div class="header-buttons">
    <button (click)="toggleTheme()" aria-label="Toggle theme">
      <span class="material-icons">dark_mode</span>
    </button>
    <button (click)="logout()" aria-label="Logout" class="logout-button">
      <span class="material-icons">logout</span>
      Sair
    </button>
  </div>
</header>

<main class="dashboard-grid">
  <div class="card blue">
    <span class="material-icons">people</span>
    <h2>Pacientes</h2>
    <p>{{ counters.pacientes }}</p>
  </div>
  <div class="card green">
    <span class="material-icons">event_available</span>
    <h2>Consultas</h2>
    <p>{{ counters.consultas }}</p>
  </div>
  <div class="card orange">
    <span class="material-icons">medication</span>
    <h2>Prescricoes</h2>
    <p>{{ counters.prescricoes }}</p>
  </div>
  <div class="card red">
    <span class="material-icons">warning</span>
    <h2>Alertas</h2>
    <p>{{ counters.alertas }}</p>
  </div>
</main>

<section class="chart-section">
  <canvas id="myChart"></canvas>
</section>

<footer>
  <p>&copy; 2025 SGHSS - VidaPlus</p>
</footer>
